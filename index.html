<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あと何時間 — 学生バイトの年収の壁 逆算（2026年分）</title>
<style>
:root{--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#86868b;--sep:rgba(60,60,67,.13);--bg:#f5f5f2;--card:#fff;--accent:#c2410c;--accent-tint:rgba(194,65,12,.09);--green:#0b7a4b;--red:#d70015;--r:16px;
--f:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;height:calc(env(safe-area-inset-top,0px) + 48px);padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;background:rgba(250,250,248,.84);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.top b{font-size:17px;font-weight:650}.top span{margin-left:auto;font-size:12px;color:var(--ink-3)}
main{max-width:560px;margin:0 auto;padding:14px 16px 48px}
.hero{background:var(--card);border-radius:var(--r);padding:20px 18px 16px;text-align:center}
.hero .k{font-size:13px;color:var(--ink-2)}.hero .n{font-size:56px;font-weight:750;letter-spacing:-.02em;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.hero .n small{font-size:20px;font-weight:650;margin-left:4px;color:var(--ink)}.hero .s{font-size:14px;color:var(--ink-2);margin-top:4px}
.hero .bind{display:inline-block;margin-top:10px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-tint);color:var(--accent)}
.sec{margin:20px 4px 6px;font-size:13px;color:var(--ink-2);font-weight:600}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 16px;position:relative}
.row+.row:before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row label{flex:1;font-size:14px;line-height:1.4}.row .h{display:block;font-size:12px;color:var(--ink-3)}
.row input[type=number]{width:104px;text-align:right;font:inherit;font-variant-numeric:tabular-nums;border:0;background:#f2f2f0;border-radius:9px;padding:7px 10px;color:var(--ink)}
.row input:focus{outline:2px solid var(--accent-tint)}.row .u{font-size:13px;color:var(--ink-2);width:28px}
.seg{display:flex;background:#eeeeeb;border-radius:9px;padding:2px}.seg button{flex:1;white-space:nowrap;border:0;background:none;font:inherit;font-size:13px;padding:6px 10px;border-radius:7px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:#e3e3e0;position:relative;transition:.2s}.sw:checked{background:var(--accent)}
.sw:before{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}.sw:checked:before{left:20px}
.walls .row{font-size:14px}.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#d6d6d2}.dot.over{background:var(--red)}.dot.ok{background:var(--green)}
.walls .amt{font-variant-numeric:tabular-nums;font-weight:650;font-size:13px;width:84px;white-space:nowrap}.walls .d{flex:1;font-size:13px;line-height:1.45}.walls .d a{color:var(--ink-3);font-size:11px;text-decoration:none}
.walls .st{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:650;font-size:16px;padding:13px;margin-top:16px;transition:transform .1s}
.btn:active{transform:scale(.98)}.btn.sub{background:var(--card);color:var(--accent)}
.note{font-size:12px;color:var(--ink-3);margin:10px 4px;line-height:1.6}.note a{color:var(--ink-2)}
#cardimg{width:100%;border-radius:12px;margin-top:12px;display:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hide{display:none!important}
.top .lang{margin-left:10px;flex:none}.top .lang button{flex:none;padding:3px 9px;font-size:12px}
:lang(zh-CN) body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
</style>
</head>
<body>
<div class="top"><b data-i18n="brand">あと何時間</b><span class="sub" data-i18n="sub">2026年分（令和8年）</span>
  <div class="seg lang" id="lang" role="group" aria-label="Language"><button data-l="ja">日</button><button data-l="zh">中</button><button data-l="en">EN</button></div></div>
<main>
  <div class="hero" id="hero">
    <div class="k" id="hk" data-i18n="hkDefault">今年、扶養を外れずに働けるのは</div>
    <div class="n"><span id="hn">–</span><small data-i18n="hUnit">時間</small></div>
    <div class="s" id="hs"></div>
    <div class="bind" id="hb"></div>
  </div>

  <div class="sec" data-i18n="secYou">あなたについて</div>
  <div class="card">
    <div class="row"><label data-i18n="age">12月31日時点の年齢</label>
      <div class="seg" id="age"><button data-v="1922" class="on" data-i18n="age1922">19〜22歳</button><button data-v="other" data-i18n="ageOther">それ以外</button></div></div>
    <div class="row"><label data-i18n="intl">留学生（資格外活動）<span class="h">週28時間の上限も計算します</span></label><input type="checkbox" class="sw" id="intl"></div>
  </div>

  <div class="sec" data-i18n="secJob">バイト</div>
  <div class="card">
    <div class="row"><label data-i18n="wage">時給<span class="h">交通費は含めない</span></label><input type="number" id="wage" value="1200" min="1" inputmode="numeric"><span class="u" data-i18n="uYen">円</span></div>
    <div class="row"><label data-i18n="ytd">今年受け取った額<span class="h">1月〜今日。明細の「総支給額」の合計</span></label><input type="number" id="ytd" value="980000" min="0" inputmode="numeric"><span class="u" data-i18n="uYen">円</span></div>
    <div class="row"><label data-i18n="pays">給料日の残り回数<span class="h">12月分が1月払いなら来年に数える</span></label><input type="number" id="pays" value="3" min="1" max="12" inputmode="numeric"><span class="u" data-i18n="uTimes">回</span></div>
    <div class="row"><label data-i18n="wk">いまの週の勤務時間<span class="h">任意。このペースで年末にいくらか</span></label><input type="number" id="wk" value="" min="0" placeholder="例 15" data-i18n-ph="wkPh" inputmode="decimal"><span class="u">h</span></div>
  </div>

  <div id="intlbox" class="hide">
    <div class="sec" data-i18n="secIntl">留学生：残りの期間（今日〜12/31）</div>
    <div class="card">
      <div class="row"><label data-i18n="tw">授業期間の週数<span class="h">週28時間まで</span></label><input type="number" id="tw" min="0" inputmode="numeric"><span class="u" data-i18n="uWeek">週</span></div>
      <div class="row"><label data-i18n="vw">長期休業の週数<span class="h">学則で定める休み。1日8時間まで（本ツールは週40hで計算）</span></label><input type="number" id="vw" value="0" min="0" inputmode="numeric"><span class="u" data-i18n="uWeek">週</span></div>
    </div>
  </div>

  <div class="sec" data-i18n="secWalls">今年の壁（給与だけの場合）</div>
  <div class="card walls" id="walls"></div>

  <button class="btn" id="mk" data-i18n="mk">結果を画像にする</button>
  <button class="btn sub hide" id="dl" data-i18n="dl">画像を保存 / 共有</button>
  <img id="cardimg" alt="結果カード" data-i18n-alt="alt">

  <p class="note">
    <span data-i18n="note"></span><span data-i18n="srcLabel">出典：</span><a href="https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1177.htm" target="_blank" rel="noopener">国税庁 No.1177 特定親族特別控除</a> /
    <a href="https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm" target="_blank" rel="noopener">No.1410 給与所得控除</a> /
    <a href="https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm" target="_blank" rel="noopener">No.1199 基礎控除</a> /
    <a href="https://www.nta.go.jp/users/gensen/2026kiso/" target="_blank" rel="noopener">令和8年度改正（扶養親族の所得要件62万円）</a> /
    <a href="https://www.nenkin.go.jp/oshirase/taisetu/2025/202508/0819.html" target="_blank" rel="noopener">日本年金機構 19〜22歳の被扶養者認定150万円未満</a> /
    <a href="https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00003.html" target="_blank" rel="noopener">出入国在留管理庁 資格外活動（週28時間）</a> /
    労働基準法 第32条（週40時間）
  </p>
</main>
<script src="i18n.js"></script>
<script src="calc.js"></script>
<script>
let R = null;
const t = k => I18N.t(k);
const man = y => t('man')(y);
const yen = y => t('yen')(y);
const $ = id => document.getElementById(id);
let young = true;
const TXT = {
  shaho: w => ({label: t('under')(man(w.amount)), d: t('dShaho'), short: t('shortShaho')}),
  fuyo: () => ({label: null, d: young ? t('dFuyoYoung') : t('dFuyoOther')}),
  tokuteiStart: () => ({d: t('dTokuteiStart')}),
  tax: () => ({d: t('dTax')}),
  tokuteiEnd: () => ({d: t('dTokuteiEnd')})
};
const label = w => Object.assign({label: man(w.amount)}, Object.fromEntries(Object.entries(TXT[w.id](w)).filter(([,v])=>v!==null)));
let last = null;
function calc(){
  if (!R) return;
  const wk = $('wk').value === '' ? null : +$('wk').value, intl = $('intl').checked;
  $('intlbox').classList.toggle('hide', !intl);
  const wl = AtoJikan.weeksLeft();
  const r = AtoJikan.compute(R, {wage: $('wage').value, ytd: $('ytd').value, pays: $('pays').value, young, intl, termWeeks: $('tw').value, vacWeeks: $('vw').value, weekHours: wk, weeksLeft: wl});
  const ytd = +$('ytd').value || 0, wage = +$('wage').value || 0, T = label(r.target);
  $('hn').textContent = r.hours.toLocaleString('ja-JP');
  $('hk').textContent = r.bindLegal ? t('hkLegal') : t('hkMoney')(T.label);
  $('hs').textContent = r.room <= 0 ? t('hsFull') : t('hs')(yen(r.roomUsed), r.perM, wl>0? r.perW.toFixed(1):'–');
  $('hb').textContent = r.bindLegal ? t('hbLegal')(r.moneyH) : (r.legalH!==null ? t('hbMoney')(r.legalH) : t('hbTarget')(T.label, T.d.replace(/\s*[（(].*/,'')));
  $('walls').innerHTML = r.walls.map((w,i) => {
    const L = label(w), s = r.status[i];
    const st = s.over ? t('stOver') : s.projOver ? t('stProj') : t('stLeft')(man(Math.max(0, w.at - ytd)));
    return `<div class="row"><span class="dot ${s.over||s.projOver?'over':'ok'}"></span><span class="amt">${L.label}</span><span class="d">${L.d}<br><a href="${w.url}" target="_blank" rel="noopener">${t('src')}</a></span><span class="st">${st}</span></div>`;
  }).join('') + (r.proj !== null ? `<div class="row"><span class="d" style="font-size:13px;color:var(--ink-2)">${t('proj')(wk, man(r.proj), man(AtoJikan.parentDed(R,ytd,young)), man(AtoJikan.parentDed(R,r.proj,young)))}</span></div>` : '');
  last = {hours: r.hours, room: r.roomUsed, perW: r.perW, perM: r.perM, target: T, bindLegal: r.bindLegal, moneyH: r.moneyH, wage};
  $('dl').classList.add('hide'); $('cardimg').style.display = 'none';
}
function card(){
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d'); const F = getComputedStyle(document.body).fontFamily;
  g.fillStyle = '#f5f5f2'; g.fillRect(0,0,1080,1350);
  g.fillStyle = '#fff'; roundRect(g, 60, 60, 960, 1230, 48); g.fill();
  g.fillStyle = '#86868b'; g.font = `600 34px ${F}`; g.fillText(`${R.year}年  あと何時間`, 120, 160);
  g.fillStyle = '#1d1d1f'; g.font = `600 44px ${F}`; g.fillText(last.bindLegal ? '在留資格のルール内で、今年あと' : `${last.target.label}に収まるように、今年あと`, 120, 330);
  g.fillStyle = '#c2410c'; g.font = `800 260px ${F}`; const t = last.hours.toLocaleString('ja-JP'); g.fillText(t, 112, 600);
  const tw = g.measureText(t).width; g.fillStyle = '#1d1d1f'; g.font = `700 80px ${F}`; g.fillText('時間', 130 + tw, 600);
  g.fillStyle = '#6e6e73'; g.font = `500 40px ${F}`;
  g.fillText(`= 週あたり 約${last.perW.toFixed(1)}時間`, 120, 720);
  g.fillText(`= 月あたり 約${last.perM}時間（給料あと${$('pays').value}回）`, 120, 785);
  g.fillText(`あと ${yen(last.room)} ・ 時給 ${yen(last.wage)}`, 120, 850);
  g.fillStyle = 'rgba(194,65,12,.09)'; roundRect(g, 120, 920, 840, 150, 28); g.fill();
  g.fillStyle = '#a8380a'; g.font = `600 34px ${F}`;
  wrap(g, last.bindLegal ? `週28時間ルールが先（お金の壁までなら${last.moneyH}時間）` : last.target.short, 150, 1008, 780, 46);
  g.fillStyle = '#86868b'; g.font = `400 26px ${F}`;
  g.fillText('令和8年分のルール（国税庁・日本年金機構・出入国在留管理庁）で計算', 120, 1160);
  g.fillText('目安です。個別の判断は勤務先・保険者・税務署へ', 120, 1200);
  return c;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function wrap(g,s,x,y,mw,lh){let line='';for(const ch of s){if(g.measureText(line+ch).width>mw){g.fillText(line,x,y);y+=lh;line=ch}else line+=ch}g.fillText(line,x,y)}
// ---- events ----
document.querySelectorAll('#age button').forEach(b => b.onclick = () => { document.querySelectorAll('#age button').forEach(x=>x.classList.toggle('on', x===b)); young = b.dataset.v === '1922'; calc(); });
['wage','ytd','pays','wk','tw','vw','intl'].forEach(id => $(id).addEventListener('input', calc));
$('tw').value = Math.floor(AtoJikan.weeksLeft());
let blob = null;
I18N.apply();
document.querySelectorAll('#lang button').forEach(b => b.onclick = () => { I18N.set(b.dataset.l); calc(); });
$('mk').onclick = () => { const c = card(); $('cardimg').src = c.toDataURL('image/png'); $('cardimg').style.display = 'block'; c.toBlob(b => { blob = b; $('dl').classList.remove('hide'); }); };
$('dl').onclick = async () => {
  const f = new File([blob], `atojikan-${R.year}.png`, {type:'image/png'});
  if (navigator.canShare && navigator.canShare({files:[f]})) { try { await navigator.share({files:[f], title:t('brand')}); return; } catch(e){} }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
};
fetch('rules/2026.json').then(r=>r.json()).then(j=>{R=j;calc();}).catch(()=>{$('hs').textContent=t('loadErr');});
</script>
</body>
</html>

<script>
let R = null;
const t = k => I18N.t(k);
const man = y => t('man')(y);
const yen = y => t('yen')(y);
const $ = id => document.getElementById(id);
let young = true;
const TXT = {
  shaho: w => ({label: t('under')(man(w.amount)), d: t('dShaho'), short: t('shortShaho')}),
  fuyo: () => ({label: null, d: young ? t('dFuyoYoung') : t('dFuyoOther')}),
  tokuteiStart: () => ({d: t('dTokuteiStart')}),
  tax: () => ({d: t('dTax')}),
  tokuteiEnd: () => ({d: t('dTokuteiEnd')})
};
const label = w => Object.assign({label: man(w.amount)}, Object.fromEntries(Object.entries(TXT[w.id](w)).filter(([,v])=>v!==null)));
let last = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let shown = null;
function countTo(el, to){
  if (reduce || shown === null || shown === to) { el.textContent = to.toLocaleString('ja-JP'); shown = to; return; }
  const from = shown, t0 = performance.now(); shown = to;
  const step = now => { const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e).toLocaleString('ja-JP'); if (k < 1 && shown === to) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const FIELDS = ['wage','ytd','pays','wk','tw','vw'], SKEY = 'atojikan.inputs';
function save(){ try { localStorage.setItem(SKEY, JSON.stringify({v: Object.fromEntries(FIELDS.map(id => [id, $(id).value])), intl: $('intl').checked, young})); } catch(e){} }
function restore(){ try { const o = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (!o) return false;
  FIELDS.forEach(id => { if (o.v && o.v[id] != null) $(id).value = o.v[id]; }); $('intl').checked = !!o.intl; young = o.young !== false;
  document.querySelectorAll('#age button').forEach(x => x.classList.toggle('on', (x.dataset.v === '1922') === young)); return true; } catch(e){ return false; } }
function calc(){
  if (!R) return;
  const wk = $('wk').value === '' ? null : +$('wk').value, intl = $('intl').checked;
  $('intlbox').classList.toggle('hide', !intl);
  const wl = AtoJikan.weeksLeft();
  const r = AtoJikan.compute(R, {wage: $('wage').value, ytd: $('ytd').value, pays: $('pays').value, young, intl, termWeeks: $('tw').value, vacWeeks: $('vw').value, weekHours: wk, weeksLeft: wl});
  const ytd = +$('ytd').value || 0, wage = +$('wage').value || 0, T = label(r.target);
  countTo($('hn'), r.hours);
  $('hk').textContent = r.bindLegal ? t('hkLegal') : t('hkMoney')(T.label);
  $('sW').textContent = wl > 0 ? r.perW.toFixed(1) : '–';
  $('sM').textContent = r.perM.toLocaleString('ja-JP');
  $('sY').textContent = man(r.roomUsed);
  const pct = Math.min(100, ytd / r.target.amount * 100);
  $('bar').style.width = pct + '%'; $('barw').classList.toggle('full', r.room <= 0);
  $('bl').textContent = t('barL')(man(ytd)); $('br').textContent = T.label;
  $('hs').textContent = r.room <= 0 ? t('hsFull') : '';
  $('hb').textContent = r.bindLegal ? t('hbLegal')(r.moneyH) : (r.legalH!==null ? t('hbMoney')(r.legalH) : t('hbTarget')(T.label, T.d.replace(/\s*[（(].*/,'')));
  $('walls').innerHTML = r.walls.map((w,i) => {
    const L = label(w), s = r.status[i], bad = s.over || s.projOver;
    const st = s.over ? t('stOver') : s.projOver ? t('stProj') : t('stLeft')(man(Math.max(0, w.at - ytd)));
    return `<div class="row"><span class="dot ${bad?'over':'ok'}"></span><div class="wl"><div class="wt"><span class="amt">${L.label}</span><span class="st${bad?' bad':''}">${st}</span></div><span class="d">${L.d} <a href="${w.url}" target="_blank" rel="noopener">${t('src')} ↗</a></span></div></div>`;
  }).join('') + (r.proj !== null ? `<div class="row"><span class="proj">${t('proj')(wk, man(r.proj), man(AtoJikan.parentDed(R,ytd,young)), man(AtoJikan.parentDed(R,r.proj,young)))}</span></div>` : '');
  last = {hours: r.hours, room: r.roomUsed, perW: r.perW, perM: r.perM, target: T, bindLegal: r.bindLegal, moneyH: r.moneyH, wage, ytd, pct, wl};
  $('dl').classList.add('hide'); $('cardimg').style.display = 'none';
  save();
}
let toastT = 0;
function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
// ---- share card: 1600×2000 (4:5), stays readable when X shrinks it ----
async function card(){
  const W = 1600, H = 2000, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const F = getComputedStyle(document.body).fontFamily;
  try { await Promise.all(['400','700'].map(w => document.fonts.load(`${w} 40px ${F}`, '0123456789時間小时'))); } catch(e){}
  const P = 120;
  g.fillStyle = '#f4f4f1'; g.fillRect(0,0,W,H);
  g.fillStyle = '#fff'; roundRect(g, 64, 64, W-128, H-128, 64); g.fill();
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#c2410c'; roundRect(g, P+8, 166, 20, 20, 10); g.fill();
  g.fillStyle = '#4a4a4f'; g.font = `700 44px ${F}`; g.fillText(t('cTitle')(R.year), P+48, 200);
  g.fillStyle = '#1d1d1f'; g.font = `700 64px ${F}`; const kl = wrap(g, last.bindLegal ? t('cLegal') : t('cMoney')(last.target.label), P+8, 400, W-2*P-16, 84);
  g.fillStyle = '#c2410c'; g.font = `700 440px ${F}`; const n = last.hours.toLocaleString('ja-JP'); g.fillText(n, P-8, 860 + (kl>1?40:0));
  const nw = g.measureText(n).width; g.fillStyle = '#1d1d1f'; g.font = `700 112px ${F}`; g.fillText(t('cUnit'), P + nw + 16, 860 + (kl>1?40:0));
  // three stats
  const sw = (W - 2*P - 2*32) / 3, st = [[last.wl>0?last.perW.toFixed(1):'–', t('statW')], [last.perM.toLocaleString('ja-JP'), t('statM')], [man(last.room), t('statY')]];
  st.forEach(([v,l],i) => { const x = P + i*(sw+32); g.fillStyle = '#f1f1ee'; roundRect(g, x, 960, sw, 220, 32); g.fill();
    g.fillStyle = '#1d1d1f'; g.font = `700 80px ${F}`; fit(g, v, 80, sw-72); g.fillText(v, x+36, 1080);
    g.fillStyle = '#4a4a4f'; g.font = `400 40px ${F}`; g.fillText(l, x+36, 1144); });
  // progress
  g.fillStyle = '#ececE8'; roundRect(g, P, 1260, W-2*P, 28, 14); g.fill();
  g.fillStyle = last.room <= 0 ? '#d70015' : '#c2410c'; roundRect(g, P, 1260, Math.max(28,(W-2*P)*last.pct/100), 28, 14); g.fill();
  g.fillStyle = '#4a4a4f'; g.font = `400 40px ${F}`; g.fillText(t('barL')(man(last.ytd)), P, 1350);

function fit(g,s,px,mw){ let p = px; while (p > 30 && g.measureText(s).width > mw) { p -= 4; g.font = g.font.replace(/\d+px/, p+'px'); } }

function lines(g,s,mw){const words=s.match(/[\u3000-\u9fff\uff00-\uffef][）」、。]?|[^\u3000-\u9fff\uff00-\uffef]+?(?:\s+|(?=[\u3000-\u9fff\uff00-\uffef])|$)/g)||[s];const out=[];let line='';for(const w of words){if(line&&g.measureText(line+w).width>mw){out.push(line.trimEnd());line=w.trimStart()}else line+=w}out.push(line);return out}
